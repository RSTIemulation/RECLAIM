function renderFamily(){const filt=state.familyFilter||'for-you';const eligible=familyIdeas.filter(x=>filt==='saved'?state.favorites.includes(x.id):filt==='all'||state.age==='any'||x.ages.includes(state.age)||x.ages.includes('mixed'));return `<span class="eyebrow">LOVE IN THE LITTLE THINGS</span><h1 class="h1">Connection over<br>perfection.</h1><p class="lede">Simple moments, shared traditions, and practical support can help families feel closer.</p><div class="soft-card" style="margin-top:20px"><div class="row" style="align-items:flex-start"><span class="icon-circle">${ico('users',22)}</span><div><b>Family first doesn't mean mother last.</b><p class="small subtle" style="margin:5px 0 0">Strong families share care, make room for one another, and honor each person's needs.</p></div></div></div><div class="section-head"><h2>Ideas for real life</h2></div><div class="tags" style="margin-top:0;margin-bottom:17px">${[['for-you','For your family'],['all','All ideas'],['saved','Saved']].map(([id,label])=>`<button class="tag ${filt===id?'selected':''}" data-action="family-filter" data-id="${id}">${label}</button>`).join('')}</div><div class="stack">${eligible.length?eligible.map(x=>`<div class="family-card"><div class="family-emoji ${x.cat==='Connection'?'alt':''}">${x.emoji}</div><div class="family-info"><div class="row between"><span class="eyebrow" style="font-size:9px">${esc(x.cat)} · ${x.min} MIN</span><button class="icon-btn" style="min-height:27px;min-width:27px;border:0;background:none;color:${state.favorites.includes(x.id)?'#b57e68':'#9eab9f'}" data-action="favorite" data-id="${x.id}" aria-label="${state.favorites.includes(x.id)?'Unsave':'Save'} ${esc(x.title)}">${ico('heart',18)}</button></div><div class="family-title">${esc(x.title)}</div><p class="family-desc">${esc(x.desc)}</p><div class="family-actions"><button class="link-btn" data-action="add-family" data-id="${x.id}">${ico('plus',14)} Add to today</button><button class="link-btn" data-action="idea" data-id="${x.id}">Details ${ico('arrow',14)}</button></div></div></div>`).join(''):`<div class="empty">No saved ideas yet. Explore activities and tap the heart to keep your favorites.</div>`}</div><p class="hint" style="margin:15px 1px">Activities are suggestions, not expectations. Adjust for your children's ages, access needs, and your family's circumstances.</p>`}
function renderGrowth(){const monday=getMonday();let bars=[];let activeDays=0,weeklyTotal=0;for(let i=0;i<7;i++){const date=new Date(monday);date.setDate(date.getDate()+i);let key=localDate(date);let n=state.days[key]?.done?.length||0;if(n)activeDays++;weeklyTotal+=n;bars.push({key,label:dayName(date),num:n,isToday:key===today()})};let allTotal=Object.values(state.days).reduce((a,d)=>a+(d?.done?.length||0),0);let refl=state.reflections[weekKey()];return `<span class="eyebrow">NOTICE YOUR PROGRESS</span><h1 class="h1">Look how far<br>you've come.</h1><p class="lede">Progress is not a streak. It's the meaningful things you make room for, at your own pace.</p><div class="metricrow" style="margin:25px 0 15px"><div class="metric"><strong>${activeDays}</strong><span>Days you took action this week</span></div><div class="metric"><strong>${weeklyTotal}</strong><span>Meaningful steps this week</span></div></div><div class="card"><div class="row between"><b>This week's rhythm</b><span class="tiny subtle">${esc(weekKey())}</span></div><div class="week-bars">${bars.map(b=>`<div class="bar-col"><div style="height:90px;display:flex;align-items:end;width:100%;justify-content:center"><div class="bar ${b.num?'filled':''}" style="height:${b.num?Math.min(90,18+b.num*19):7}px;${b.isToday?'outline:2px solid #b9ceba;outline-offset:3px;':''}"></div></div><span>${b.label.slice(0,1)}</span></div>`).join('')}</div><div class="row" style="margin-top:18px;color:var(--muted);font-size:11px">${ico('heart',15)} Quiet days still count as part of your story.</div></div>
 <div class="section-head"><h2>Your weekly reflection</h2></div><div class="card"><p class="reflection-quote">“What helped you feel a little more like yourself?”</p>${refl?`<p class="small" style="white-space:pre-wrap">${esc(refl.good)}</p>${refl.next?`<p class="small subtle">Next week: ${esc(refl.next)}</p>`:''}`:`<p class="small subtle">Take a moment to notice something good, something hard, or something you need more of.</p>`}${btn(refl?'Edit reflection':'Reflect on this week','reflection','secondary full')}</div><div class="section-head"><h2>Your personal intention</h2></div><div class="soft-card"><p class="small" style="margin-top:0">${state.intention?esc(state.intention):'Choose a meaningful, manageable intention for the week.'}</p>${btn(state.intention?'Change intention':'Set an intention','intention','ghost full')}</div><div class="notice" style="margin-top:20px">${ico('sprout',18)} <span><b>${allTotal} steps recorded</b> since you started this local prototype. Every small action counts—even when your week looks different than planned.</span></div>`}
function renderMe(){return `<span class="eyebrow">MADE TO FIT YOUR LIFE</span><h1 class="h1">Your space.<br>Your choices.</h1><p class="lede">Your priorities and capacity may change. Update your plan whenever you need to.</p><div class="card" style="margin-top:23px"><div class="row" style="align-items:flex-start"><span class="icon-circle">${ico('user',22)}</span><div style="flex:1"><b>Your personal plan</b><p class="tiny subtle" style="margin:3px 0 0">All settings are saved on this device.</p></div></div><div class="setting"><label for="your-name">Your name (optional)</label><input class="text-input" id="your-name" data-setting="name" maxlength="32" placeholder="What should we call you?" value="${esc(state.name)}"></div><div class="setting"><label for="coach-tone">Coaching style</label><select class="select" id="coach-tone" data-setting="tone"><option value="gentle" ${state.tone==='gentle'?'selected':''}>Gentle support</option><option value="balanced" ${state.tone==='balanced'?'selected':''}>Balanced encouragement</option><option value="direct" ${state.tone==='direct'?'selected':''}>Respectful accountability</option></select></div><div class="setting"><label for="daily-time">Your available time</label><select class="select" id="daily-time" data-setting="time">${[5,10,20,30].map(n=>`<option value="${n}" ${state.time===n?'selected':''}>${n}${n===30?'+':''} minutes</option>`).join('')}</select></div><div class="setting"><label for="child-age">Children's stage</label><select class="select" id="child-age" data-setting="age">${[['baby','Baby'],['toddler','Toddlers'],['school','School-age'],['teen','Teens'],['mixed','Mixed ages'],['any','Prefer not to say']].map(([id,s])=>`<option value="${id}" ${state.age===id?'selected':''}>${s}</option>`).join('')}</select></div><div class="setting"><label>Your priorities (choose any)</label><div class="tags">${Object.entries(focusNames).map(([id,label])=>`<button class="tag ${state.focus.includes(id)?'selected':''}" data-action="focus" data-id="${id}">${esc(label)}</button>`).join('')}</div></div></div>
 <div class="section-head"><h2>Privacy & your data</h2></div><div class="card"><div class="row" style="align-items:flex-start"><span class="icon-circle">${ico('lock',20)}</span><div><b>Private by default</b><p class="small subtle" style="margin:5px 0 0">This prototype stores your answers and progress only in this browser's local storage. No accounts, analytics, cloud backup, or data selling.</p></div></div><div class="hr"></div><div class="stack">${btn(`${ico('download',16)} Export a backup`,'export','ghost full')}${btn(`${ico('upload',16)} Restore from a backup`,'import','ghost full')}${btn(`${ico('trash',16)} Erase my data`,'delete-confirm','ghost full')}</div><p class="hint">Data can be lost if you clear browser storage. Someone with access to your unlocked device/browser may also access it.</p></div>
 <div class="section-head"><h2>Support & information</h2></div><div class="card"><div class="row" style="align-items:flex-start"><span class="icon-circle clay">${ico('heart',20)}</span><div><b>Help is a sign of strength</b><p class="small subtle" style="margin:5px 0 0">RECLAIM is a wellness companion, not a clinician, diagnosis, therapy service, or emergency resource. Persistent distress, significant changes in functioning, or health concerns deserve professional care.</p></div></div><div class="hr"></div><p class="small subtle" style="margin:0 0 8px">If you or someone else is in immediate danger, call local emergency services. In the U.S., call or text <a href="tel:988">988</a> for mental-health crisis support.</p>${btn(`About RECLAIM ${ico('info',16)}`,'about','secondary full')}</div><div style="margin-top:14px">${btn(`${ico('download',16)} Install RECLAIM on your phone`,'install','ghost full')}</div><p class="footer-meta">RECLAIM · Early prototype v1.0 · Not for clinical use</p>`}
function openModal(content){modal=content;const root=document.getElementById('modal-root');root.innerHTML=`<div class="modal-backdrop" data-backdrop="1"><div class="modal" role="dialog" aria-modal="true" aria-label="RECLAIM dialog">${content}</div></div>`;let x=root.querySelector('[data-action="close-modal"]');if(x)x.focus()}
function closeModal(){document.getElementById('modal-root').innerHTML='';modal=''}
const modalHead=(title,description='')=>`<div class="modal-head"><div><h2 class="h3">${esc(title)}</h2>${description?`<p class="small subtle" style="margin:5px 0 0">${esc(description)}</p>`:''}</div><button class="icon-btn" aria-label="Close" data-action="close-modal">${ico('close',17)}</button></div>`;
function openIntention(){openModal(`${modalHead('Your intention','One manageable thing you want to make room for this week.')}<textarea id="modal-intention" class="textarea" maxlength="180" placeholder="This week, I want to…">${esc(state.intention)}</textarea><p class="hint">Examples: Eat breakfast before I start scrolling. Ask for one afternoon of help. Go outside with the kids three times.</p><div style="margin-top:17px">${btn('Save my intention','save-intention','primary full')}</div>`)}
function openReflection(){const refl=state.reflections[weekKey()]||{};openModal(`${modalHead('A little room to reflect','No grading, no streaks. Just a moment to notice.')}<label class="strong small" for="reflect-good">What helped you feel more like yourself?</label><textarea id="reflect-good" maxlength="800" class="textarea" style="margin:8px 0 18px" placeholder="A small win, a hard thing, or something you noticed…">${esc(refl.good||'')}</textarea><label class="strong small" for="reflect-next">What support or change would help next week?</label><textarea id="reflect-next" maxlength="500" class="textarea" style="margin-top:8px" placeholder="Something I need, a habit to try, or a person to ask…">${esc(refl.next||'')}</textarea><div style="margin-top:17px">${btn('Save reflection','save-reflection','primary full')}</div>`)}
function openIdea(id){const x=familyIdeas.find(v=>v.id===id);if(!x)return;openModal(`${modalHead(x.title,`${x.cat} · About ${x.min} minutes`)}<div class="family-emoji" style="width:70px;height:70px;font-size:34px;margin-bottom:17px">${x.emoji}</div><p class="lede" style="margin:0 0 12px">${esc(x.desc)}</p><div class="notice">Make it your own. Adapt for your child's developmental stage, abilities, and interests. The point is connection, not a picture-perfect activity.</div><div style="margin-top:16px">${btn(`${ico('plus',16)} Add to my day`,'add-family','primary full',`data-id="${id}"`)}</div>`)}
function openCoachInfo(){openModal(`${modalHead('How your coach works','Flexible suggestions, not a mental-health assessment.')}<div class="stack"><div class="row">${ico('heart',21)}<div class="small"><b>Compassion first.</b><br>Your energy check-in always takes priority over ambitious goals.</div></div><div class="row">${ico('sprout',21)}<div class="small"><b>Challenge by choice.</b><br>Restore, Rebuild, and Rise are freely selectable—never earned through a score.</div></div><div class="row">${ico('shield',21)}<div class="small"><b>You remain in control.</b><br>Change activities, choose restorative days, or adjust your coaching style whenever you need.</div></div></div><div class="notice" style="margin-top:20px">This early version uses a transparent, rule-based activity library. It does not infer diagnoses, monitor your health, or send data to an AI service.</div>`)}
function openAbout(){openModal(`${modalHead('About RECLAIM','Motherhood · Wellness · Purpose')}<p class="small">RECLAIM celebrates loving families, personal responsibility, meaningful motherhood, rest, and growth. It welcomes mothers with different family structures and life circumstances.</p><div class="notice">This prototype is not medical advice, treatment, psychological assessment, or a crisis response service. It does not claim that habits alone treat mental illness. Consult qualified healthcare professionals for individual needs, including pregnancy, postpartum concerns, nutritional restrictions, or exercise limitations.</div><p class="small subtle">Thoughtful support, not more pressure. More living, less scrolling.</p>`)}
function openInstall(){openModal(`${modalHead('Add RECLAIM to your phone','Use the published HTTPS version for installation.')}<div class="stack"><div class="row">${ico('home',21)}<div class="small"><b>Android (Chrome)</b><br>Open the hosted app → Chrome's ⋮ menu → Add to Home screen / Install.</div></div><div class="row">${ico('home',21)}<div class="small"><b>iPhone (Safari)</b><br>Open the hosted app → Share button → Add to Home Screen.</div></div></div><p class="hint">You can preview the HTML file directly, but installation and offline caching require hosting over HTTPS, for example with GitHub Pages.</p>`)}
function exportBackup(){const blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString(),app:'RECLAIM'},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`reclaim-backup-${today()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Backup downloaded to your device. Store it privately.')}
function applyBackup(obj){if(!obj||typeof obj!=='object'||!obj.onboarded||!obj.days||!Array.isArray(obj.focus))throw Error('Unrecognized backup format.');const allowed=['onboarded','onboardingStep','focus','time','age','tone','mode','name','days','favorites','familyFilter','intention','reflections'];let next=defaultState();for(let k of allowed){if(Object.hasOwn(obj,k))next[k]=obj[k]}if(!Array.isArray(next.focus)||typeof next.days!=='object'||!next.days||!Array.isArray(next.favorites)||typeof next.reflections!=='object'||!next.reflections)throw Error('Backup is missing required data.');next.focus=next.focus.filter(x=>Object.hasOwn(focusNames,x));next.tone=['gentle','balanced','direct'].includes(next.tone)?next.tone:'balanced';next.mode=modes.includes(next.mode)?next.mode:'restore';next.time=[5,10,20,30].includes(Number(next.time))?Number(next.time):10;next.age=['baby','toddler','school','teen','mixed','any'].includes(next.age)?next.age:'any';state=next;save();screen='today';closeModal();render();notify('Your backup has been restored.')}
const setFocus=id=>{if(!Object.hasOwn(focusNames,id))return;state.focus=state.focus.includes(id)?state.focus.filter(x=>x!==id):[...state.focus,id];save();render()};
const go=(tab)=>{screen=tab;render();window.scrollTo({top:0,behavior:'instant'})};
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b){if(e.target.matches('[data-backdrop]'))closeModal();return}const a=b.dataset.action;const id=b.dataset.id;const d=getDay();
 switch(a){
  case 'next':state.onboardingStep=Math.min(3,(state.onboardingStep||0)+1);save();render();window.scrollTo(0,0);break;
  case 'back':state.onboardingStep=Math.max(0,(state.onboardingStep||0)-1);save();render();window.scrollTo(0,0);break;
  case 'finish':state.onboarded=true;state.onboardingStep=0;state.mode='restore';save();go('today');break;
  case 'focus':setFocus(id);break;
  case 'time':state.time=Number(b.dataset.val)||10;save();render();break;
  case 'age':state.age=b.dataset.val;save();render();break;
  case 'tone':state.tone=b.dataset.val;save();render();break;
  case 'nav':go(b.dataset.tab);break;
  case 'energy':d.energy=b.dataset.val;d.rest=false;save();render();break;
  case 'complete':d.done=d.done.includes(id)?d.done.filter(x=>x!==id):[...d.done,id];save();render();if(d.done.includes(id))notify('A step taken. That counts.');break;
  case 'swap':{let slot=Number(b.dataset.slot);d.swaps[slot]=(d.swaps[slot]||0)+1;save();render();break}
  case 'pause':d.rest=!d.rest;save();render();break;
  case 'mode':state.mode=id;save();render();notify(`${modeInfo[id].title} is now your chosen path.`);break;
  case 'family-filter':state.familyFilter=id;save();render();break;
  case 'favorite':state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];save();render();break;
  case 'add-family':{let x=familyIdeas.find(x=>x.id===id);if(!x)break;const task={id:`bonus-${id}-${today()}`,title:x.title,detail:x.desc,focus:'family',min:x.min};if(d.extras.some(y=>y.id===task.id)){notify('Already added to today.');break}d.extras.push(task);save();closeModal();go('today');notify('Added to your daily actions.');break}
  case 'remove-extra':d.extras=d.extras.filter(x=>x.id!==id);d.done=d.done.filter(x=>x!==id);save();render();break;
  case 'idea':openIdea(id);break;
  case 'intention':openIntention();break;
  case 'save-intention':state.intention=document.getElementById('modal-intention').value.trim().slice(0,180);save();closeModal();render();notify('Your intention is saved.');break;
  case 'reflection':openReflection();break;
  case 'save-reflection':{const good=document.getElementById('reflect-good').value.trim().slice(0,800);const next=document.getElementById('reflect-next').value.trim().slice(0,500);state.reflections[weekKey()]={good,next};save();closeModal();render();notify('Your reflection is saved privately.');break}
  case 'coach-info':openCoachInfo();break;
  case 'about':openAbout();break;
  case 'install':openInstall();break;
  case 'export':exportBackup();break;
  case 'import':document.getElementById('import-file').click();break;
  case 'delete-confirm':openModal(`${modalHead('Erase your data?','This cannot be undone without a separate backup.')}<p class="small">Your onboarding answers, saved routines, activity history, and reflections will be erased from this browser.</p><div class="button-row" style="margin-top:20px">${btn('Keep my data','close-modal','ghost')}${btn('Erase everything','delete-all','primary')}</div>`);break;
  case 'delete-all':localStorage.removeItem(STORAGE_KEY);state=defaultState();screen='today';closeModal();render();window.scrollTo(0,0);notify('Local RECLAIM data erased.');break;
  case 'close-modal':closeModal();break;
 }
});
document.addEventListener('change',e=>{let t=e.target;if(t.dataset.setting){const k=t.dataset.setting;let v=t.value;if(k==='time')v=Number(v);if(k==='name')v=v.trim().slice(0,32);state[k]=v;save();notify('Preference saved.');if(k!=='name')render()}});
document.getElementById('import-file').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{if(file.size>2_000_000)throw Error('Backup file is too large.');const json=JSON.parse(await file.text());applyBackup(json)}catch(err){notify(err?.message||'Could not restore backup.')}e.target.value=''});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
if('serviceWorker' in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();
})();

</script>
</body>
</html>
